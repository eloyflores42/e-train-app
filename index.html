<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-TRAIN | Plataforma</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --primary: #3b82f6; --accent: #10b981; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-width: 400px; margin: 50px auto; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid var(--border); background: #0b1120; color: #fff; }
    button { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>E-TRAIN Test</h2>
    <p>Si ves esto, el archivo HTML cargó bien.</p>
    <input type="email" id="testEmail" placeholder="Correo">
    <button onclick="probarConexion()">Probar Conexión</button>
    <div id="testRes" style="margin-top:10px; font-size:0.85rem;"></div>
  </div>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxBPxg4axHeCIV9sklf3LBfr95gxWl9iouHEnSL2iYTHjrCL2NrOAXEyP6q-O8vf2qC_g/exec";
    async function probarConexion() {
      const email = document.getElementById("testEmail").value;
      const resDiv = document.getElementById("testRes");
      resDiv.textContent = "Conectando...";
      try {
        const response = await fetch(`${API_URL}?email=${encodeURIComponent(email)}&pin=1234`);
        const data = await response.json();
        resDiv.textContent = "Respuesta: " + JSON.stringify(data);
      } catch(e) {
        resDiv.textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
